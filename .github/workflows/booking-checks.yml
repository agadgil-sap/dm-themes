name: Booking site checks
on:
  push:
    paths: ['booking/**', 'website/**', 'dental-match-booking.html', '.lavish/dental-match-booking.html', '.github/workflows/booking-checks.yml']
  pull_request:
    paths: ['booking/**', 'website/**', 'dental-match-booking.html', '.lavish/dental-match-booking.html', '.github/workflows/booking-checks.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate JavaScript and form models
        run: |
          for source in booking/*.js website/js/*.js; do node --check "$source"; done
          node --test booking/tests/model.test.cjs website/tests/forms.test.cjs
      - name: Verify generated pages are current
        run: |
          python3 website/build.py
          python3 booking/build.py
          git diff --exit-code
